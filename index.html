
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Event Analyzer</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
            margin-bottom: 20px;
        }

        input[type="text"],
        input:not([type]) {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .logout {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            font-size: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        .rank1 {
            background: #fff8dc;
        }

        .rank2 {
            background: #f0f0f0;
        }

        .rank3 {
            background: #ffe4b5;
        }

        .summary {
            margin-top: 15px;
            padding: 10px;
            background: #fafafa;
            border-left: 4px solid #1976d2;
        }

        .teamEntry {
            display: flex;
            justify-content: space-between;
            padding: 6px;
            border-bottom: 1px solid #ddd;
        }

        .teamExists {
            color: #d32f2f;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="logout" type="button" onclick="logout()">
        Logout
    </button>

    <div class="card">

        <h1>FRC Event Analyzer</h1>

        <p>Select an event:</p>

        <div style="display:flex; gap:12px; flex-wrap:wrap;">

            <div>
                <label for="yearSelect">Year:</label><br>
                <select id="yearSelect"
                    onchange="loadEvents()"
                    style="padding:10px;width:180px;">
                </select>
            </div>

      <div style="position:relative;">

    <label for="eventSearch">Event:</label><br>

    <input
        type="text"
        id="eventSearch"
        placeholder="Search events..."
        autocomplete="off"
        oninput="searchEvents()"
        onfocus="searchEvents()"
        style="padding:10px;width:350px;"
    >

    <div
        id="eventResults"
        style="
            display:none;
            position:absolute;
            top:65px;
            left:0;
            width:650px;
            max-width:90vw;
            max-height:400px;
            overflow-y:auto;
            background:white;
            border:1px solid #ccc;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
            z-index:1000;
        ">
    </div>

    <input type="hidden" id="eventSelect">

</div>

        </div>

        <br>

        <button onclick="analyzeEvent()">
            Analyze Event
        </button>

        <p id="status"></p>

        <div class="card">
            <h2>All Teams:</h2>
            <div id="results"></div>
        </div>

        <button onclick="exportScoutingData()">
            Export Event
        </button>

        <button onclick="triggerImport()">
            Import Event
        </button>

        <input
            id="importFile"
            type="file"
            accept=".json"
            hidden
            onchange="readImportFile(event)"
        >

    </div>

</div>

<script>
let allEvents = [];
let selectedEvent = null;
let importedData = null;
let selectedTeams = new Set();


function searchEvents() {

    const search = document
        .getElementById("eventSearch")
        .value.toLowerCase();

    const results = document.getElementById("eventResults");

    results.innerHTML = "";

    const filtered = allEvents.filter(event => {

        const searchable = [
            event.name,
            event.key,
            event.city,
            event.state_prov,
            event.country,
            event.start_date,
            event.end_date
        ].filter(Boolean).join(" ").toLowerCase();

        return searchable.includes(search);

    });

    if (filtered.length === 0) {

        results.innerHTML =
            '<div style="padding:15px;">No matching events found.</div>';

        results.style.display = "block";

        return;
    }

    filtered.forEach(event => {

        const row = document.createElement("div");

        row.style.cssText = `
            padding:12px;
            border-bottom:1px solid #ddd;
            cursor:pointer;
        `;

        const location = [
            event.city,
            event.state_prov,
            event.country
        ].filter(Boolean).join(", ");

        const week = event.week !== null &&
                     event.week !== undefined
            ? `Week ${event.week}`
            : "Week unavailable";

        row.innerHTML = `
            <strong>${escapeHTML(event.name)}</strong>

            <div style="
                display:flex;
                flex-wrap:wrap;
                gap:12px;
                margin-top:7px;
                font-size:13px;
                color:#555;
            ">

                <span>
                    <strong>Key:</strong>
                    ${escapeHTML(event.key)}
                </span>

                <span>
                    <strong>Start:</strong>
                    ${escapeHTML(event.start_date || "N/A")}
                </span>

                <span>
                    <strong>End:</strong>
                    ${escapeHTML(event.end_date || "N/A")}
                </span>

                <span>
                    <strong>Week:</strong>
                    ${escapeHTML(String(week))}
                </span>

            </div>

            <div style="
                margin-top:5px;
                font-size:13px;
                color:#777;
            ">
                ${escapeHTML(location)}
            </div>
        `;

        row.addEventListener("click", () => {

            selectEvent(event);

        });

        row.addEventListener("mouseenter", () => {
            row.style.background = "#f0f6ff";
        });

        row.addEventListener("mouseleave", () => {
            row.style.background = "white";
        });

        results.appendChild(row);

    });

    results.style.display = "block";
}

function selectEvent(event) {

    selectedEvent = event;

    document.getElementById("eventSearch").value =
        `${event.name} (${event.key})`;

    document.getElementById("eventSelect").value =
        event.key;

    document.getElementById("eventResults").style.display =
        "none";

}




function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);

}


// ======================================
// URL PARAMETERS
// ======================================

function getParams() {
    const p = new URLSearchParams(window.location.search);

    return {
        event: p.get("event"),
        team: p.get("team")
    };
}


function openTeam(eventKey, teamNumber) {
    const url = new URL(window.location.href);

    url.searchParams.set("event", eventKey);
    url.searchParams.set("team", teamNumber);

    window.open(url.toString(), "_blank");
}


// ======================================
// CLOUDFLARE WORKER FETCH FUNCTION
// ======================================

async function tba(path) {

    if (
        typeof path !== "string" ||
        !/^\/[a-zA-Z0-9_/-]+$/.test(path) ||
        path.includes("..")
    ) {
        throw new Error("Invalid TBA API path.");
    }

    const response = await fetch(
        "/api/tba?path=" + encodeURIComponent(path),
        {
            method: "GET",
            credentials: "same-origin",
            headers: {
                "Accept": "application/json"
            }
        }
    );

    if (!response.ok) {
        const message = await response.text();

        throw new Error(
            `TBA API error ${response.status}: ${message}`
        );
    }

    return response.json();
}

function getSelectedEvent() {

    const search =
        document.getElementById("eventSearch").value;

    const event = allEvents.find(event => {

        const label =
            `${event.name} - ${event.city}, ${
                event.state_prov || event.country
            } (${event.key})`;

        return label === search;

    });

    return event ? event.key : "";
}

// ======================================
// LOAD EVENTS
// ======================================

async function loadEvents() {

    const year = document.getElementById("yearSelect").value;

    const status = document.getElementById("status");

    const results = document.getElementById("eventResults");

    document.getElementById("eventSearch").value = "";
    document.getElementById("eventSelect").value = "";

    selectedEvent = null;
    allEvents = [];

    results.style.display = "none";

    if (!year) return;

    status.innerText = "Loading events...";

    try {

        allEvents = await tba(`/events/${year}`);

        if (!Array.isArray(allEvents)) {
            throw new Error("Invalid event data.");
        }

        allEvents.sort((a, b) =>
            a.start_date.localeCompare(b.start_date)
        );

        status.innerText =
            `Loaded ${allEvents.length} events for ${year}.`;

    } catch (error) {

        console.error(error);

        status.innerText = "Could not load events.";

    }
}


// ======================================
// LOAD YEARS
// ======================================

function loadYears() {

    const yearSelect =
        document.getElementById("yearSelect");

    const currentYear = new Date().getFullYear();

    yearSelect.innerHTML =
        '<option value="">Select Year</option>';

    for (
        let year = currentYear - 5;
        year <= currentYear + 5;
        year++
    ) {

        const option = document.createElement("option");

        option.value = year;
        option.textContent = year;

        yearSelect.appendChild(option);
    }

    yearSelect.value = currentYear;

    loadEvents();
}


window.addEventListener("DOMContentLoaded", loadYears);


// ======================================
// TEAM SCORING
// ======================================

function calculateScore(team) {

    return (
        team.opr * 0.45 +
        team.ccwm * 0.35 +
        team.winPct * 0.20
    );
}


function generateSummary(team) {

    const strengths = [];

    if (team.opr > 40) {
        strengths.push("Elite offensive output");
    }

    if (team.ccwm > 15) {
        strengths.push("Strong winning impact");
    }

    if (team.winPct > 0.70) {
        strengths.push("Consistent match results");
    }

    if (strengths.length === 0) {
        strengths.push("Developing performance profile");
    }

    return strengths.join(", ");
}


// ======================================
// LOAD TEAM PAGE
// ======================================

async function loadTeamPage(eventKey, teamNumber) {

    const status = document.getElementById("status");

    const results = document.getElementById("results");

    status.innerText = "Loading team...";

    try {

        const [teams, rankings, oprs] = await Promise.all([

            tba(`/event/${eventKey}/teams/simple`),

            tba(`/event/${eventKey}/rankings`),

            tba(`/event/${eventKey}/oprs`)

        ]);

        const team = teams.find(
            t => String(t.team_number) === String(teamNumber)
        );

        if (!team) {

            results.innerHTML = "<h2>Team not found.</h2>";

            return;
        }

        const rankData = rankings.rankings?.find(
            r => r.team_key === team.key
        );

        const wins = Number(rankData?.record?.wins) || 0;

        const losses = Number(rankData?.record?.losses) || 0;

        const winPct =
            wins + losses > 0
                ? wins / (wins + losses)
                : 0;

        const analyzed = {

            teamNumber: team.team_number,

            nickname: team.nickname || "",

            opr: Number(oprs.oprs?.[team.key]) || 0,

            ccwm: Number(oprs.ccwms?.[team.key]) || 0,

            rank: Number(rankData?.rank) || 999,

            wins,
            losses,
            winPct
        };

        analyzed.score = calculateScore(analyzed);


        // ======================================
        // TEAM PAGE HTML
        // ======================================

        results.innerHTML = `

            <h2>
                Team ${analyzed.teamNumber}
                - ${analyzed.nickname}
            </h2>

            <div style="margin-bottom:15px;">

                <label>
                    Match:

                    <select id="roundSelector">

                        ${Array.from({ length: 20 }, (_, i) =>
                            `<option value="${i + 1}">
                                Match ${i + 1}
                            </option>`
                        ).join("")}

                    </select>

                </label>

            </div>


            <div class="summary">

                <p>
                    <strong>Overall Score:</strong>
                    ${analyzed.score.toFixed(2)}
                </p>

                <p>
                    <strong>Official Rank:</strong>
                    ${analyzed.rank === 999 ? "N/A" : analyzed.rank}
                </p>

                <p>
                    <strong>Record:</strong>
                    ${analyzed.wins}-${analyzed.losses}
                </p>

                <p>
                    <strong>OPR:</strong>
                    ${analyzed.opr.toFixed(2)}
                </p>

                <p>
                    <strong>CCWM:</strong>
                    ${analyzed.ccwm.toFixed(2)}
                </p>

                <div>

                    <label style="display:flex;gap:4px;margin:5px 0;">
                        <span>Kitbot?</span>
                        <input type="checkbox" id="kitbot">
                    </label>

                    <label style="display:flex;gap:4px;margin:5px 0;">
                        <span>Stuck on Fuel?</span>
                        <input type="checkbox" id="fuel">
                    </label>

                    <label style="display:flex;gap:4px;margin:5px 0;">
                        <span>Alive whole match?</span>
                        <input type="checkbox" id="alive">
                    </label>

                </div>

                <div>

                    <strong>Scouting Notes:</strong>

                    <br>

                    <textarea
                        id="notes"
                        style="
                            width:100%;
                            min-height:150px;
                            margin-top:5px;
                            padding:8px;
                            resize:vertical;
                        "
                        placeholder="Enter scouting notes here..."
                    ></textarea>

                </div>

            </div>

        `;


        // Load scouting data.

        const roundSelector =
            document.getElementById("roundSelector");

        loadRound(eventKey, teamNumber);

        roundSelector.addEventListener("change", () => {
            loadRound(eventKey, teamNumber);
        });

        ["kitbot", "fuel", "alive"].forEach(id => {

            document.getElementById(id).addEventListener(
                "change",
                () => saveRound(eventKey, teamNumber)
            );

        });

        document.getElementById("notes").addEventListener(
            "input",
            () => saveRound(eventKey, teamNumber)
        );

        status.innerText =
            `Viewing Team ${teamNumber}`;

    } catch (error) {

        console.error(error);

        status.innerText =
            "Failed to load team: " + error.message;
    }
}

async function analyzeEvent() {
    const eventKey = getSelectedEvent();
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    if (!eventKey) {
        status.innerText = "Please select an event first.";
        return;
    }

    results.innerHTML = "";
    status.innerText = `Loading event ${eventKey}...`;

    try {
        const [teamsResult, rankingsResult, oprsResult] =
            await Promise.allSettled([
                tba(`/event/${eventKey}/teams/simple`),
                tba(`/event/${eventKey}/rankings`),
                tba(`/event/${eventKey}/oprs`)
            ]);

        if (teamsResult.status === "rejected") {
            throw teamsResult.reason;
        }

        const teams = teamsResult.value;

        if (!Array.isArray(teams)) {
            throw new Error("Invalid team data returned by TBA.");
        }

        if (teams.length === 0) {
            results.innerHTML = "<p>No teams found.</p>";
            status.innerText = "No teams found for this event.";
            return;
        }

        const rankings =
            rankingsResult.status === "fulfilled"
                ? rankingsResult.value
                : null;

        const oprs =
            oprsResult.status === "fulfilled"
                ? oprsResult.value
                : null;

        const rankingMap = {};

        if (Array.isArray(rankings?.rankings)) {
            rankings.rankings.forEach(r => {
                rankingMap[r.team_key] = r;
            });
        }

        const analyzedTeams = teams.map(team => {
            const rankData = rankingMap[team.key];

            const wins = Number(rankData?.record?.wins) || 0;
            const losses = Number(rankData?.record?.losses) || 0;

            const winPct = wins + losses > 0
                ? wins / (wins + losses)
                : 0;

            const analyzed = {
                teamNumber: team.team_number,
                nickname: team.nickname || "",
                teamKey: team.key,
                opr: Number(oprs?.oprs?.[team.key]) || 0,
                ccwm: Number(oprs?.ccwms?.[team.key]) || 0,
                dpr: Number(oprs?.dprs?.[team.key]) || 0,
                rank: Number(rankData?.rank) || 999,
                wins,
                losses,
                winPct
            };

            analyzed.score = calculateScore(analyzed);

            return analyzed;
        });

        analyzedTeams.sort((a, b) => b.score - a.score);

        let html = `
            <h3>Event: ${eventKey}</h3>

            ${!rankings
                ? "<p>Rankings are not available yet.</p>"
                : ""}

            ${!oprs
                ? "<p>OPR statistics are not available yet.</p>"
                : ""}

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>Official Rank</th>
                        <th>Record</th>
                        <th>OPR</th>
                        <th>CCWM</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
        `;

        analyzedTeams.forEach((team, index) => {
            let cls = "";

            if (index === 0) cls = "rank1";
            if (index === 1) cls = "rank2";
            if (index === 2) cls = "rank3";

            html += `
                <tr class="${cls}">
                    <td>${index + 1}</td>
                    <td>
                        <a href="#"
                           onclick="openTeam('${eventKey}','${team.teamNumber}'); return false;">
                            ${team.teamNumber} - ${team.nickname}
                        </a>
                    </td>
                    <td>${team.rank === 999 ? "N/A" : team.rank}</td>
                    <td>${team.wins}-${team.losses}</td>
                    <td>${team.opr.toFixed(2)}</td>
                    <td>${team.ccwm.toFixed(2)}</td>
                    <td>${team.score.toFixed(2)}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;

        results.innerHTML = html;

        status.innerText =
            `Successfully analyzed ${teams.length} teams at ${eventKey}.`;

    } catch (error) {
        console.error("Event analysis failed:", error);
        status.innerText = "Error loading event: " + error.message;
    }
}


// SCOUTING DATA

function scoutingKey(eventKey, teamNumber, round) {
    return `scouting_${eventKey}_${teamNumber}_round_${round}`;
}

function saveRound(eventKey, teamNumber) {
    const match = document.getElementById("roundSelector").value;

    const data = {
        kitbot: document.getElementById("kitbot").checked,
        fuel: document.getElementById("fuel").checked,
        alive: document.getElementById("alive").checked,
        notes: document.getElementById("notes").value
    };

    localStorage.setItem(
        scoutingKey(eventKey, teamNumber, match),
        JSON.stringify(data)
    );
}

function loadRound(eventKey, teamNumber) {
    const match = document.getElementById("roundSelector").value;

    const data = JSON.parse(
        localStorage.getItem(
            scoutingKey(eventKey, teamNumber, match)
        ) || "{}"
    );

    document.getElementById("kitbot").checked = data.kitbot || false;
    document.getElementById("fuel").checked = data.fuel || false;
    document.getElementById("alive").checked = data.alive || false;
    document.getElementById("notes").value = data.notes || "";
}


// URL HANDLING

window.addEventListener("load", async () => {
    const params = getParams();

    if (params.event && params.team) {
        loadTeamPage(params.event, params.team);
    } else if (params.event) {
        await analyzeEventFromURL(params.event);
    }
});

async function analyzeEventFromURL(eventKey) {
    try {
        const eventData = await tba(`/event/${eventKey}`);

        document.getElementById("yearSelect").value =
            eventData.year;

        await loadEvents();

        const selected = allEvents.find(
            e => e.key === eventKey
        );

        if (!selected) {
            throw new Error("Event not found.");
        }

        selectEvent(selected);

        await analyzeEvent();

    } catch (error) {
        console.error(error);

        document.getElementById("status").innerText =
            "Could not load event from URL.";
    }
}


// EXPORT SCOUTING DATA

function exportScoutingData() {
    const params = getParams();

    if (!params.event) {
        alert("Open an event first.");
        return;
    }

    const exportData = {
        event: params.event,
        teams: {}
    };

    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);

        if (!key.startsWith("scouting_")) continue;

        const parts = key.split("_");
        const eventKey = parts[1];
        const team = parts[2];
        const round = parts[4];

        if (eventKey !== params.event) continue;

        if (!exportData.teams[team]) {
            exportData.teams[team] = {
                rounds: {}
            };
        }

        exportData.teams[team].rounds[round] =
            JSON.parse(localStorage.getItem(key));
    }

    const blob = new Blob(
        [JSON.stringify(exportData, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = params.event + ".json";
    a.click();

    URL.revokeObjectURL(url);
}


// IMPORT SCOUTING DATA

function readImportFile(event) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            importedData = JSON.parse(e.target.result);

            if (!importedData.event || !importedData.teams) {
                throw new Error("Invalid scouting file structure.");
            }

            buildTeamList();

        } catch (error) {
            console.error(error);
            alert("Invalid scouting file.");
        }
    };

    reader.readAsText(file);
    event.target.value = "";
}


function buildTeamList() {
    selectedTeams.clear();

    const div = document.getElementById("teamList");
    div.innerHTML = "";

    const eventKey = importedData.event;

    Object.keys(importedData.teams)
        .sort((a, b) => Number(a) - Number(b))
        .forEach(team => {

            let exists = false;

            for (let i = 1; i <= 20; i++) {
                if (localStorage.getItem(
                    `scouting_${eventKey}_${team}_round_${i}`
                )) {
                    exists = true;
                    break;
                }
            }

            const row = document.createElement("div");
            row.className = "teamEntry";

            row.innerHTML = `
                <label>
                    <input type="checkbox" value="${team}">
                    Team ${team}
                </label>

                ${exists
                    ? '<span class="teamExists">Already Exists</span>'
                    : ""}
            `;

            div.appendChild(row);
        });

    document.getElementById("importDialog").style.display = "block";

    hookSearch();
    hookCheckboxes();
}


function hookCheckboxes() {
    document.querySelectorAll("#teamList input").forEach(box => {
        box.onchange = function() {
            if (this.checked) {
                selectedTeams.add(this.value);
            } else {
                selectedTeams.delete(this.value);
            }
        };
    });
}


function hookSearch() {
    const search = document.getElementById("teamSearch");

    search.oninput = function() {
        const value = this.value.toLowerCase();

        document.querySelectorAll("#teamList .teamEntry")
            .forEach(row => {
                row.style.display =
                    row.innerText.toLowerCase().includes(value)
                        ? "flex"
                        : "none";
            });
    };
}


function selectAllTeams() {
    document.querySelectorAll("#teamList input").forEach(c => {
        c.checked = true;
        selectedTeams.add(c.value);
    });
}


function clearAllTeams() {
    document.querySelectorAll("#teamList input").forEach(c => {
        c.checked = false;
    });

    selectedTeams.clear();
}


function closeImportDialog() {
    document.getElementById("importDialog").style.display = "none";
}


function finishImport() {
    if (!importedData) {
        alert("No file loaded.");
        return;
    }

    if (selectedTeams.size === 0) {
        alert("No teams selected.");
        return;
    }

    const eventKey = importedData.event;

    let importedCount = 0;
    let overwrittenCount = 0;

    selectedTeams.forEach(team => {
        const teamData = importedData.teams[team];

        if (!teamData || !teamData.rounds) return;

        let exists = false;

        for (let i = 1; i <= 20; i++) {
            if (localStorage.getItem(
                `scouting_${eventKey}_${team}_round_${i}`
            )) {
                exists = true;
                break;
            }
        }

        if (exists) {
            const ok = confirm(
                `Team ${team} already exists.\nOverwrite its scouting data?`
            );

            if (!ok) return;

            for (let i = 1; i <= 20; i++) {
                localStorage.removeItem(
                    `scouting_${eventKey}_${team}_round_${i}`
                );
            }

            overwrittenCount++;
        }

        Object.keys(teamData.rounds).forEach(round => {
            const key =
                `scouting_${eventKey}_${team}_round_${round}`;

            localStorage.setItem(
                key,
                JSON.stringify(teamData.rounds[round])
            );
        });

        importedCount++;
    });

    closeImportDialog();

    alert(
        `Imported ${importedCount} team(s).\n` +
        `Overwritten ${overwrittenCount} team(s).`
    );

    const params = getParams();

    if (params.event === eventKey && params.team) {
        loadRound(eventKey, params.team);
    }
}


function triggerImport() {
    const input = document.getElementById("importFile");

    input.value = "";
    input.click();
}


// LOGOUT

async function logout() {
    try {
        const response = await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
        });

        if (response.status === 204) {
            window.location.href = "/securitytest";
            return;
        }

        if (!response.ok) {
            alert("Logout failed. Please try again.");
            return;
        }

        const result = await response.json();

        if (result.success) {
            window.location.href = "/securitytest";
        } else {
            alert("Logout failed. Please try again.");
        }

    } catch (error) {
        console.error("Logout failed:", error);
        alert("Unable to log out. Please try again.");
    }
}
