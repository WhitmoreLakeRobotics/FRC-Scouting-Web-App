<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Event Analyzer</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
            margin-bottom: 20px;
        }

        .input[type="text"],
        input:not([type]) {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        .rank1 {
            background: #fff8dc;
        }

        .rank2 {
            background: #f0f0f0;
        }

        .rank3 {
            background: #ffe4b5;
        }

        .summary {
            margin-top: 15px;
            padding: 10px;
            background: #fafafa;
            border-left: 4px solid #1976d2;
        }
        
        .teamEntry{

display:flex;

justify-content:space-between;

padding:6px;

border-bottom:1px solid #ddd;

}

.teamExists{

color:#d32f2f;

font-size:12px;

}
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <h1>FRC Event Analyzer</h1>

            <p>Enter an event key:</p>

            <input id="eventKey" placeholder="2025miket">
            <button onclick="analyzeEvent()">Analyze Event</button>

            <p id="status"></p>
        </div>

        <div class="card">
            <h2>All Teams:</h2>
            <div id="results"></div>
        </div>
<button onclick="exportScoutingData()">
    Export Event
</button>
<button onclick="triggerImport()">
    Import Event
</button>

<input
    id="importFile"
    type="file"
    accept=".json"
    hidden
    onchange="readImportFile(event)">
    </div>

    <script>
        
        let importedData=null;

let selectedTeams=new Set();

        function getParams() {
            const p = new URLSearchParams(window.location.search);
            return {
                event: p.get("event"),
                team: p.get("team")
            };
        }

        function openTeam(eventKey, teamNumber) {
            window.open(`?event=${eventKey}&team=${teamNumber}`, "_blank");
        }
        const TBA_KEY = "kjYvgurAPpTKfVOXRauXV5z4VjnyZ5wpv6t8GjIj51x3yjCrUxZUisXQ4MJpOFtJ";

        const BASE_URL = "https://www.thebluealliance.com/api/v3";

        async function tba(path) {

            const response = await fetch(
                BASE_URL + path, {
                    headers: {
                        "X-TBA-Auth-Key": TBA_KEY
                    }
                }
            );

            if (!response.ok) {
                throw new Error("TBA API Error");
            }

            return response.json();
        }

        function calculateScore(team) {

            return (
                team.opr * 0.45 +
                team.ccwm * 0.35 +
                team.winPct * 0.20

            );
        }

        function generateSummary(team) {

            const strengths = [];

            if (team.opr > 40) {
                strengths.push("Elite offensive output");
            }

            if (team.ccwm > 15) {
                strengths.push("Strong winning impact");
            }

            if (team.winPct > 0.70) {
                strengths.push("Consistent match results");
            }

            if (strengths.length === 0) {
                strengths.push("Developing performance profile");
            }

            return strengths.join(", ");
        }
        async function loadTeamPage(eventKey, teamNumber) {

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    status.innerText = "Loading team...";

    try {

        const [
            teams,
            rankings,
            oprs
        ] = await Promise.all([
            tba(`/event/${eventKey}/teams/simple`),
            tba(`/event/${eventKey}/rankings`),
            tba(`/event/${eventKey}/oprs`)
        ]);

        const team =
            teams.find(
                t => String(t.team_number) === String(teamNumber)
            );

        if (!team) {
            results.innerHTML = "<h2>Team not found.</h2>";
            return;
        }

        const rankData =
            rankings.rankings.find(
                r => r.team_key === team.key
            );

        const wins =
            rankData?.record?.wins || 0;

        const losses =
            rankData?.record?.losses || 0;

        const winPct =
            wins + losses > 0 ?
            wins / (wins + losses) :
            0;

        const analyzed = {

            teamNumber: team.team_number,

            nickname: team.nickname || "",

            opr: oprs.oprs?.[team.key] || 0,

            ccwm: oprs.ccwms?.[team.key] || 0,

            rank: rankData?.rank || 999,

            wins,

            losses,

            winPct
        };

        analyzed.score =
            calculateScore(analyzed);

        results.innerHTML = `
            <h2>
                Team ${analyzed.teamNumber}
                - ${analyzed.nickname}
            </h2>
<div style="margin-bottom:15px;">
    <label>
        match:
        <select id="roundSelector">
            ${Array.from({length: 20}, (_, i) =>
                `<option value="${i+1}">match ${i+1}</option>`
            ).join("")}
        </select>
    </label>
</div>
            <div class="summary">

                <p>
                    <strong>Overall Score:</strong>
                    ${analyzed.score.toFixed(2)}
                </p>

                <p>
                    <strong>Official Rank:</strong>
                    ${analyzed.rank}
                </p>

                <p>
                    <strong>Record:</strong>
                    ${analyzed.wins}-${analyzed.losses}
                </p>

                <p>
                    <strong>OPR:</strong>
                    ${analyzed.opr.toFixed(2)}
                </p>

                <p>
                    <strong>CCWM:</strong>
                    ${analyzed.ccwm.toFixed(2)}
                </p>

                <div>

                    <label style="display:flex;align-items:center;gap:4px;margin:2px 0;">
                        <span>Kitbot?</span>
<input type="checkbox" id="kitbot">
</label>

                    <label style="display:flex;align-items:center;gap:4px;margin:2px 0;">
                        <span>Stuck on Fuel?</span>
<input type="checkbox" id="fuel">
</label>

                    <label style="display:flex;align-items:center;gap:4px;margin:2px 0;">
                        <span>Alive whole match?</span>
<input type="checkbox" id="alive">
</label>

                </div>

                <div>
                    <strong>Scouting Notes:</strong>
                    <br>

                    <textarea
    id="notes"
    style="
        width:100%;
        min-height:150px;
        margin-top:5px;
        padding:8px;
        resize:vertical;
    "
    placeholder="Enter scouting notes here..."
></textarea>
                </div>

            </div>
        `;
        
        const roundSelector =
    document.getElementById("roundSelector");

loadRound(eventKey, teamNumber);

roundSelector.addEventListener(
    "change",
    () => loadRound(eventKey, teamNumber)
);

document.getElementById("kitbot")
    .addEventListener(
        "change",
        () => saveRound(eventKey, teamNumber)
    );

document.getElementById("fuel")
    .addEventListener(
        "change",
        () => saveRound(eventKey, teamNumber)
    );

document.getElementById("alive")
    .addEventListener(
        "change",
        () => saveRound(eventKey, teamNumber)
    );

document.getElementById("notes")
    .addEventListener(
        "input",
        () => saveRound(eventKey, teamNumber)
    );

        status.innerText =
            `Viewing Team ${teamNumber}`;

    } catch (error) {

        console.error(error);

        status.innerText =
            "Failed to load team.";
    }
}

        async function analyzeEvent() {

            const eventKey =
                document.getElementById("eventKey").value.trim();

            const status =
                document.getElementById("status");

            const results =
                document.getElementById("results");

            results.innerHTML = "";

            status.innerText = "Loading...";

            try {

                const [
                    teams,
                    rankings,
                    oprs
                ] = await Promise.all([
                    tba(`/event/${eventKey}/teams/simple`),
                    tba(`/event/${eventKey}/rankings`),
                    tba(`/event/${eventKey}/oprs`)
                ]);

                const rankingMap = {};

                rankings.rankings.forEach(r => {
                    rankingMap[r.team_key] = r;
                });

                const analyzedTeams =
                    teams.map(team => {

                        const rankData =
                            rankingMap[team.key];

                        const wins =
                            rankData?.record?.wins || 0;

                        const losses =
                            rankData?.record?.losses || 0;

                        const winPct =
                            wins + losses > 0 ?
                            wins / (wins + losses) :
                            0;

                        const analyzed = {
                            teamNumber: team.team_number,
                            nickname: team.nickname || "",
                            teamKey: team.key,

                            opr: oprs.oprs?.[team.key] || 0,

                            ccwm: oprs.ccwms?.[team.key] || 0,

                            dpr: oprs.dprs?.[team.key] || 0,

                            rank: rankData?.rank || 999,

                            wins,
                            losses,
                            winPct
                        };

                        analyzed.score =
                            calculateScore(analyzed);

                        return analyzed;
                    });

                analyzedTeams.sort(
                    (a, b) => b.score - a.score
                );

                const NoOverflow =
                    analyzedTeams.slice(0, 9999);

                let html = `
        <h3>
        Event: ${eventKey}
        </h3>

        <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Team</th>
            <th>Official Rank</th>
            <th>Record</th>
            <th>OPR</th>
            <th>CCWM</th>
            <th>Score</th>
        </tr>
        </thead>
        <tbody>
        `;

                NoOverflow.forEach((team, index) => {


                    let cls = "";

                    if (index === 0) cls = "rank1";
                    if (index === 1) cls = "rank2";
                    if (index === 2) cls = "rank3";

                    html += `
            <tr class="${cls}">
                <td>${index+1}</td>
                <td>
    <a href="#" onclick="openTeam('${eventKey}','${team.teamNumber}')">
        ${team.teamNumber} - ${team.nickname}
    </a>
</td>
                <td>${team.rank}</td>
                <td>
                    ${team.wins}-${team.losses}
                </td>
                <td>
                    ${team.opr.toFixed(2)}
                </td>
                <td>
                    ${team.ccwm.toFixed(2)}
                </td>
                <td>
                    ${team.score.toFixed(2)}
                </td>
            </tr>
            `;
                });

                html += `
        </tbody>
        </table>
        `;


                results.innerHTML = html;

                status.innerText =
                    `Analyzed ${teams.length} teams`;

            } catch (error) {

                console.error(error);

                status.innerText =
                    "Error loading event. Check event key and API key.";
            }
        }
        
     function scoutingKey(eventKey, teamNumber, round) {
    return `scouting_${eventKey}_${teamNumber}_round_${round}`;
}

function saveRound(eventKey, teamNumber) {

    const match =
        document.getElementById("roundSelector").value;

    const data = {
        kitbot: document.getElementById("kitbot").checked,
        fuel: document.getElementById("fuel").checked,
        alive: document.getElementById("alive").checked,
        notes: document.getElementById("notes").value
    };

    localStorage.setItem(
        scoutingKey(eventKey, teamNumber, match),
        JSON.stringify(data)
    );
}

function loadRound(eventKey, teamNumber) {

    const match =
        document.getElementById("roundSelector").value;

    const data =
        JSON.parse(
            localStorage.getItem(
                scoutingKey(eventKey, teamNumber, match)
            )
        ) || {};

    document.getElementById("kitbot").checked = data.kitbot || false;
    document.getElementById("fuel").checked = data.fuel || false;
    document.getElementById("alive").checked = data.alive || false;
    document.getElementById("notes").value = data.notes || "";
}
        
      window.addEventListener("load", () => {

    const params = getParams();

    if (params.event && params.team) {

        document.getElementById("eventKey").value =
            params.event;

        loadTeamPage(params.event, params.team);

    } else if (params.event) {

        document.getElementById("eventKey").value =
            params.event;

        analyzeEvent();
    }
});

function exportScoutingData(){

const params=getParams();

if(!params.event){

alert("Open an event first.");

return;

}

const exportData={

event:params.event,

teams:{}

};

for(let i=0;i<localStorage.length;i++){

const key=localStorage.key(i);

if(!key.startsWith("scouting_")) continue;

const parts=key.split("_");

/*
scouting_EVENT_TEAM_round_ROUND
*/

const eventKey=parts[1];

const team=parts[2];

const round=parts[4];

if(eventKey!==params.event) continue;

if(!exportData.teams[team]){

exportData.teams[team]={

rounds:{}

};

}

exportData.teams[team].rounds[round]=

JSON.parse(localStorage.getItem(key));

}

const blob=new Blob(

[JSON.stringify(exportData,null,2)],

{type:"application/json"}

);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=params.event+".json";

a.click();

URL.revokeObjectURL(url);

}

function importScoutingData(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const data =
                JSON.parse(e.target.result);

            let count = 0;

            for (const key in data) {

                localStorage.setItem(
                    key,
                    JSON.stringify(data[key])
                );

                count++;
            }

            alert(`Imported ${count} scouting records.`);

            const params = getParams();

            if (params.event && params.team) {
                loadRound(params.event, params.team);
            }

        } catch {

            alert("Invalid scouting file.");
        }
    };

    reader.readAsText(file);

    event.target.value = "";
}

function readImportFile(event){

const file=event.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

importedData=JSON.parse(e.target.result);

buildTeamList();

};

reader.readAsText(file);

}
function buildTeamList(){

selectedTeams.clear();

const div=document.getElementById("teamList");

div.innerHTML="";

const eventKey=importedData.event;

Object.keys(importedData.teams)

.sort((a,b)=>Number(a)-Number(b))

.forEach(team=>{

let exists=false;

for(let i=1;i<=20;i++){

if(localStorage.getItem(

`scouting_${eventKey}_${team}_round_${i}`

)){

exists=true;

break;

}

}

const row=document.createElement("div");

row.className="teamEntry";

row.innerHTML=`

<label>

<input

type="checkbox"

value="${team}"

>

Team ${team}

</label>

${exists?'<span class="teamExists">Already Exists</span>':""}

`;

div.appendChild(row);

});

document.getElementById("importDialog").style.display="block";

hookSearch();

hookCheckboxes();

}
function hookCheckboxes(){

document

.querySelectorAll("#teamList input")

.forEach(box=>{

box.onchange=function(){

if(this.checked)

selectedTeams.add(this.value);

else

selectedTeams.delete(this.value);

};

});

}
function hookSearch(){

const search=document.getElementById("teamSearch");

search.oninput=function(){

const value=this.value.toLowerCase();

document

.querySelectorAll("#teamList .teamEntry")

.forEach(row=>{

row.style.display=

row.innerText.toLowerCase().includes(value)

?

"flex"

:

"none";

});

};

}
function selectAllTeams(){

document

.querySelectorAll("#teamList input")

.forEach(c=>{

c.checked=true;

selectedTeams.add(c.value);

});

}
function clearAllTeams(){

document

.querySelectorAll("#teamList input")

.forEach(c=>{

c.checked=false;

});

selectedTeams.clear();

}
function closeImportDialog(){

document.getElementById("importDialog").style.display="none";

}
function finishImport(){

if(!importedData){

alert("No file loaded.");

return;

}

if(selectedTeams.size===0){

alert("No teams selected.");

return;

}

const eventKey=importedData.event;

let importedCount=0;

let overwrittenCount=0;

selectedTeams.forEach(team=>{

const teamData=importedData.teams[team];

if(!teamData) return;

/*
Check if team already exists
*/

let exists=false;

for(let i=1;i<=20;i++){

if(localStorage.getItem(
`scouting_${eventKey}_${team}_round_${i}`
)){
exists=true;
break;
}

}

/*
If exists → ask before overwrite
*/

if(exists){

const ok=confirm(

`Team ${team} already exists.\nOverwrite its scouting data?`

);

if(!ok) return;

/*
Delete old data for this team/event
*/

for(let i=1;i<=20;i++){

localStorage.removeItem(
`scouting_${eventKey}_${team}_round_${i}`
);

}

overwrittenCount++;

}

/*
Write imported rounds
*/

Object.keys(teamData.rounds).forEach(round=>{

const key=
`scouting_${eventKey}_${team}_round_${round}`;

localStorage.setItem(

key,

JSON.stringify(teamData.rounds[round])

);

});

importedCount++;

});

/*
Close dialog
*/

closeImportDialog();

alert(

`Imported ${importedCount} team(s).\n` +

`Overwritten ${overwrittenCount} team(s).`

);

/*
Refresh current view if needed
*/

const params=getParams();

if(params.event===eventKey&&params.team){

loadRound(eventKey,params.team);

}

}
function triggerImport(){

const input=document.getElementById("importFile");

/* IMPORTANT: reset before opening picker */
input.value="";

input.click();

}
    </script>

<div id="importDialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;">

<div style="
background:white;
width:500px;
max-height:80vh;
overflow:auto;
margin:40px auto;
padding:20px;
border-radius:10px;
">

<h2>Import Scouting Data</h2>

<p>Select the teams to import.</p>

<input
id="teamSearch"
placeholder="Search team..."
style="width:100%;padding:8px;margin-bottom:10px;">

<div style="margin-bottom:10px;">

<button onclick="selectAllTeams()">
Select All
</button>

<button onclick="clearAllTeams()">
Clear
</button>

</div>

<div
id="teamList"
style="
border:1px solid #ccc;
padding:10px;
max-height:350px;
overflow:auto;
">
</div>

<br>

<button onclick="finishImport()">
Import Selected
</button>

<button onclick="closeImportDialog()">
Cancel
</button>

</div>

</div>
</body>

</html>
